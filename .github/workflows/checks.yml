name: Check skill and starter
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the starter
        run: cd template && python3 build.py
      - name: Check every slide in a real browser
        run: cd template && npm install --no-audit --no-fund && node verify.cjs
