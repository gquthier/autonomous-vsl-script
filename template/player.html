<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
@font-face{font-family:Jost;src:url(data:font/woff2;base64,__JOST__) format('woff2');font-weight:100 900}
@font-face{font-family:Instrument;src:url(data:font/woff2;base64,__INSTRUMENT__) format('woff2');font-weight:100 900}
/* Brand tokens, filled by build.py from brand.json. Every color on the page derives from these eight values. */
:root{--bg:__BG__;--fg:__FG__;--soft:__SOFT__;--mut:__MUT__;--accent:__ACCENT__;--node:__NODE__;--panel:__PANEL__;--on-accent:__ON_ACCENT__;color-scheme:__SCHEME__;
--line:color-mix(in srgb,var(--fg) 14%,transparent);--f12:color-mix(in srgb,var(--fg) 12%,transparent);--f18:color-mix(in srgb,var(--fg) 18%,transparent);--f20:color-mix(in srgb,var(--fg) 20%,transparent);
--a08:color-mix(in srgb,var(--accent) 8%,transparent);--a12:color-mix(in srgb,var(--accent) 12%,transparent);--a15:color-mix(in srgb,var(--accent) 15%,transparent);--a33:color-mix(in srgb,var(--accent) 33%,transparent);--a47:color-mix(in srgb,var(--accent) 47%,transparent);--a53:color-mix(in srgb,var(--accent) 53%,transparent)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 Instrument,'Helvetica Neue',sans-serif;overflow:hidden}
body.idle{cursor:none}
button,select,input{font:inherit}button,a,select{color:inherit}
button,select{background:none;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
button:hover,a:hover{color:var(--accent);border-color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button[disabled]{opacity:.3;cursor:default}a{text-decoration:none}
button[aria-pressed=true]{background:var(--a08);border-color:var(--a47);color:var(--accent)}
.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:66px minmax(0,1fr) auto}
.top,.stage,.bottom{min-width:0;max-width:100%}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}
.brand{display:block;width:118px;flex-shrink:0;line-height:0;color:var(--fg)}.brand svg{width:100%;height:auto;display:block}
.brand .wm{display:block;width:max-content;font:400 13px/1 Jost,sans-serif;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.chapter{display:none;min-width:0;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.presenter .chapter{display:block}
.progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);transition:width .2s,opacity .4s}
.stage{position:relative;min-height:0;overflow:auto;padding:18px 6vw;display:flex;align-items:safe center;justify-content:center;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.slide{width:100%;max-width:1120px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,28px);animation:enter .3s ease}
.eyebrow{font:400 13px/1.4 Instrument,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
.spoken{font:350 clamp(28px,3.7vw,56px)/1.3 Jost,'Avenir Next',sans-serif;letter-spacing:-.012em;margin:0;max-width:30ch;text-wrap:balance}
.spoken em,.headline em{font-style:normal;color:var(--accent)}
.has-visual .spoken,.has-stats .spoken{font-size:clamp(23px,2.8vw,42px);max-width:34ch}
.headline{display:none;font:350 clamp(40px,6.4vw,96px)/1.1 Jost,sans-serif;letter-spacing:-.018em;max-width:19ch;text-wrap:balance;margin:0}
.has-visual .headline,.has-stats .headline{font-size:clamp(34px,4.4vw,66px)}
.screen .spoken,.screen .eyebrow{display:none}.screen .headline{display:block}
.w{display:inline-block;animation:word .42s cubic-bezier(.2,.7,.2,1) both}
.visual{width:min(100%,760px);flex-shrink:0}
.visual svg{display:block;width:100%;height:auto;max-height:min(30vh,270px);margin:0 auto;overflow:visible}
.screen .visual{width:min(100%,1040px)}
.screen .visual svg{max-height:min(54vh,500px)}
.lbl{font-family:Instrument,sans-serif;font-size:17px;fill:var(--soft)}
.lblm{font-family:Instrument,sans-serif;font-size:15px;fill:var(--mut)}
.ttl{font-family:Jost,sans-serif;font-weight:400;font-size:24px;fill:var(--fg)}
.big{font-family:Jost,sans-serif;font-weight:350;font-size:60px;fill:var(--accent)}
.gld{fill:var(--accent)}.gldt{fill:var(--accent)}.ona{fill:var(--on-accent)}.sft{fill:var(--soft)}
.st{stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dm{stroke:var(--f20);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nd{fill:var(--node);stroke:var(--a33);stroke-width:1}
.nd.on{stroke:var(--accent);stroke-width:1.8}
.nd.off{stroke:var(--f12)}
.off-g{opacity:.28}
.flow{stroke:var(--accent);stroke-dasharray:10 190;stroke-width:2.2;fill:none;stroke-linecap:round;animation:flow 3.4s linear infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease-out both}
.walk{transform-box:fill-box;transform-origin:center;animation:walk 4.2s linear infinite}
.d1{animation-delay:.18s}.d2{animation-delay:.36s}.d3{animation-delay:.54s}.d4{animation-delay:.72s}.d5{animation-delay:.9s}.d6{animation-delay:1.08s}
.static *{animation:none!important}
.static .draw{stroke-dashoffset:0}
.stats{display:flex;justify-content:center;gap:clamp(30px,6vw,96px);flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;gap:8px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.screen .has-stats .headline{display:none}
.screen .stat .v{font-size:clamp(68px,10.5vw,168px)}
.screen .stat .l{font-size:clamp(16px,1.7vw,25px)}
.stat:nth-child(2){animation-delay:.2s}
.stat .v{font:350 clamp(52px,7.4vw,112px)/1 Jost,sans-serif;color:var(--accent);letter-spacing:-.02em;white-space:nowrap}
.stat .l{font-size:clamp(14px,1.35vw,20px);line-height:1.35;color:var(--soft);max-width:320px}
.who{font-size:clamp(12px,1.1vw,15px);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.who b{font-weight:500;color:var(--fg)}
.ctabar{display:inline-block;background:var(--accent);color:var(--on-accent);font:500 clamp(14px,1.4vw,19px)/1 Instrument,sans-serif;padding:14px 26px;border-radius:999px;animation:rise .5s ease both}
.notes{position:fixed;right:20px;top:70px;width:min(430px,calc(100vw - 40px));max-height:65vh;overflow:auto;z-index:3;background:var(--panel);border:1px solid var(--a33);border-radius:12px;padding:22px;box-shadow:0 15px 70px rgba(0,0,0,.55);font-size:14px;color:var(--soft)}
.notes h2{font-size:15px;color:var(--fg);margin:0 0 8px}.notes p{white-space:pre-line}.notes[hidden]{display:none}
.bottom{padding:12px 28px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;transition:opacity .4s}
.idle .bottom,.idle .progress{opacity:0}
.nav,.tools{display:flex;gap:8px;align-items:center}.nav button{font-size:21px;padding:4px 12px}
.count{min-width:83px;text-align:center;color:var(--soft);font-size:12px;font-variant-numeric:tabular-nums}
.tools button,.tools select{font-size:12px}.tools select{max-width:210px}.tools option{background:var(--bg)}
.read-more{font-size:12px;color:var(--mut)}.timer{font-variant-numeric:tabular-nums;color:var(--mut);font-size:11px}
.help{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);font-size:12px;padding:14px 20px;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:4;max-width:90vw}.help[hidden]{display:none}
body.presenter .spoken{font-size:clamp(28px,3.8vw,54px);max-width:35ch}
.presenter .visual,.presenter .stats,.presenter .who,.presenter .ctabar{display:none}
.presenter .notes{position:static;width:100%;max-height:none;margin-top:20px;box-shadow:none}
.presenter .stage{display:block}.presenter .slide{margin:30px auto}
.presenter .headline{display:none}.presenter .spoken{display:block}
.nextline{color:var(--mut);font-size:15px;margin-top:20px;text-align:left;max-width:80ch}
@keyframes enter{from{opacity:0}to{opacity:1}}
@keyframes word{from{opacity:0;transform:translateY(.22em)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes pulse{0%,100%{opacity:.35}45%,65%{opacity:1}}
@keyframes walk{0%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(.16);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
@media(max-width:700px){.top{padding:0 18px}.brand{width:96px}.stage{padding:14px 20px}.slide{gap:18px}.spoken{font-size:clamp(25px,6.6vw,32px);line-height:1.3;max-width:30ch}.has-visual .spoken,.has-stats .spoken{font-size:23px}.headline{font-size:44px}.has-visual .headline,.has-stats .headline{font-size:34px}.stat .v{font-size:52px}.visual svg,.screen .visual svg{max-height:210px}.bottom{padding:10px 14px;gap:8px}.tools{gap:5px;flex-wrap:wrap}.tools button,.tools select{font-size:11px;padding:7px 9px}.read-more,.timer{display:none}.count{min-width:62px}.tools select{max-width:125px}.notes{font-size:13px}.app{grid-template-rows:54px minmax(0,1fr) auto}}
@media(max-height:760px) and (min-width:701px){.app{grid-template-rows:50px minmax(0,1fr) auto}.stage{padding:8px 5vw}.spoken{font-size:clamp(26px,3.1vw,44px)}.has-visual .spoken,.has-stats .spoken{font-size:clamp(20px,2.3vw,31px)}.slide{gap:12px}.visual svg{max-height:27vh}.screen .visual svg{max-height:40vh}.bottom{padding:8px 20px}.stat .v{font-size:clamp(46px,6vw,84px)}.has-visual .headline,.has-stats .headline{font-size:clamp(30px,3.6vw,50px)}}
@media print{body{overflow:visible;color:#111;background:white}.top,.bottom,.progress,.notes{display:none}.app{display:block;height:auto}.stage{display:block;overflow:visible}.slide{color:#111}.spoken{font-size:24px}}
</style></head><body>
<div class="progress" id="progress"></div><div class="app" id="app">
<header class="top"><div class="brand" aria-label="__BRAND__">__LOGO__</div><div class="chapter" id="chapter"></div></header>
<main class="stage" id="stage"><article class="slide" id="slide" aria-live="polite"></article></main>
<aside class="notes" id="notes" hidden><h2 id="notesTitle"></h2><p id="noteText"></p><a class="read-more" id="readAll" href="script.html"></a></aside>
<footer class="bottom"><div class="nav"><button id="prev">‹</button><span class="count" id="count"></span><button id="next">›</button><span class="timer" id="timer"></span></div>
<div class="tools"><select id="jump"></select><button id="mode" aria-pressed="false"></button><button id="motion" aria-pressed="false"></button><button id="noteButton" aria-pressed="false"></button><button id="presenter"></button><button id="full">⛶</button><button id="helpButton">?</button></div></footer>
</div><div class="help" id="help" hidden></div>
<script id="deck-data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('deck-data').textContent),S=D.slides,U=D.ui;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1),10)||1)-1));
let screen=false,notes=false,motion=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPresenter=new URLSearchParams(location.search).has('presenter');
if(isPresenter){document.body.classList.add('presenter');notes=true;$('presenter').hidden=true;}
let channel;try{channel=new BroadcastChannel('vsl-'+D.id);channel.onmessage=e=>{if(e.data.type==='slide'&&e.data.index!==i){i=e.data.index;render(false);}};}catch(e){}

// Text: *asterisks* turn accent-colored, each word fades in. French punctuation stays glued to its word.
function typo(t){return D.lang==='fr'?t.replace(/ ([:;?!»])/g,' $1').replace(/« /g,'« '):t;}
function words(text){
 let n=0,g=false;
 return typo(text).split(/( +)/).map(tok=>{
  if(!tok)return '';if(/^ +$/.test(tok))return tok;
  let h='';
  tok.split(/(\*)/).forEach(p=>{if(p==='*'){g=!g;return;}if(p)h+=g?`<em>${esc(p)}</em>`:esc(p);});
  return `<span class="w" style="animation-delay:${Math.min(n++*26,620)}ms">${h}</span>`;
 }).join('');
}

// Line icons, 30 x 30.
const I={
 photo:'<rect x="3" y="4" width="24" height="22" rx="3"/><circle cx="10" cy="11" r="2"/><path d="m4 23 8-8 5 5 4-4 6 7"/>',
 form:'<rect x="5" y="3" width="20" height="25" rx="3"/><path d="M10 10h10M10 16h10M10 22h6"/>',
 phone:'<rect x="8" y="2" width="15" height="27" rx="3"/><path d="M13 25h5M13 6h5"/>',
 chart:'<path d="M4 4v22h23M9 20v-6M16 20V8M23 20v-9"/>',
 person:'<circle cx="15" cy="9" r="5"/><path d="M5 28v-3a10 10 0 0 1 20 0v3"/>',
 check:'<path d="m6 15 6 6 14-15"/>',
 lock:'<rect x="5" y="13" width="20" height="14" rx="3"/><path d="M10 13V8a5 5 0 0 1 10 0v5M15 18v4"/>',
 pin:'<path d="M24 11c0 7-9 17-9 17S6 18 6 11a9 9 0 1 1 18 0Z"/><circle cx="15" cy="11" r="3"/>',
 eye:'<path d="M2 15s5-9 13-9 13 9 13 9-5 9-13 9-13-9-13-9Z"/><circle cx="15" cy="15" r="4"/>',
 hand:'<path d="M3 16l6-6 6 3 6-3 6 6M9 10l6 8 3-2M15 18l-2 3M18 16l3 3"/>',
 house:'<path d="M3 15 15 4l12 11M7 12v14h16V12M12 26v-8h6v8"/>',
 search:'<circle cx="13" cy="13" r="9"/><path d="m20 20 7 7"/>',
 grid:'<rect x="3" y="3" width="11" height="11" rx="2"/><rect x="17" y="3" width="11" height="11" rx="2"/><rect x="3" y="17" width="11" height="11" rx="2"/><rect x="17" y="17" width="11" height="11" rx="2"/>',
 web:'<rect x="2" y="5" width="27" height="21" rx="3"/><path d="M2 11h27M7 8h1M11 8h1"/>',
 coin:'<circle cx="15" cy="15" r="12"/><path d="M19 10a6 6 0 0 0-9 5 6 6 0 0 0 9 5M8 13h8M8 17h8"/>',
 clock:'<circle cx="15" cy="15" r="12"/><path d="M15 8v7l5 3"/>',
};
const ic=(n,x,y,s=1,c='st')=>`<g class="${c}" transform="translate(${x} ${y}) scale(${s})">${I[n]}</g>`;
const T=(x,y,t,c='lbl',a='middle')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${esc(t)}</text>`;
const V=(c,h=240)=>`<svg viewBox="0 0 720 ${h}" role="img" aria-hidden="true">${c}</svg>`;

// The 23 diagrams. Each one explains one idea. Text comes from content.py; limits live in vsl.py.
const VIS={
 bars:({a,b,two})=>{const fa=a.share*600,inside=a.share>.7;return V(
  `${T(60,44,a.label,'lblm','start')}<rect class="nd" x="60" y="56" width="600" height="26" rx="6"/><rect class="gld grow" x="60" y="56" width="${fa}" height="26" rx="6"/>${inside?T(60+fa-14,76,a.value,'lbl ona','end'):T(60+fa+16,76,a.value,'lbl','start')}`+
  `<g class="${two?'in d2':'off-g'}">${T(60,134,b.label,'lblm','start')}<rect class="nd" x="60" y="146" width="600" height="26" rx="6"/>`+
  (two?`<rect class="sft grow d3" x="60" y="146" width="${b.share*600}" height="26" rx="6" opacity=".62"/>`+(b.extra?`<rect class="sft grow d4" x="${60+b.share*600}" y="146" width="${b.extra*600}" height="26" rx="6" opacity=".24"/>`:'')+T(360,208,b.value):'')+`</g>`);},
 board:({cards,lit,tag})=>V(`<path class="dm" d="M30 216h660"/>`+cards.map(([p,st],k)=>{const x=70+k*205,gold=lit&&k===0,dim=lit&&k===cards.length-1;
  return `<g class="in d${k+1} ${dim?'off-g':''}"><rect class="nd ${gold?'on':''}" x="${x}" y="28" width="170" height="172" rx="10"/>${T(x+85,72,p,'ttl')}<path class="dm" d="M${x+26} 96h118M${x+26} 118h118M${x+26} 140h78"/>`+(lit?T(x+85,180,st,gold?'lbl gldt':'lblm'):'')+`</g>`;}).join('')+(tag?`<g>${T(360,238,tag,'lblm')}</g>`:''),246),
 pills:({items,icon})=>{const n=items.length,x0=(720-(n*158+(n-1)*20))/2;return V(items.map((l,k)=>{const x=x0+k*178;return `<g class="in d${k+1}"><rect class="nd" x="${x}" y="58" width="158" height="74" rx="37"/>${T(x+79,102,l)}</g>`;}).join('')+`<g class="in d5"><path class="dm" d="M60 172h600"/>${ic(icon||'clock',345,186,1,'dm')}</g>`);},
 fanout:({from,you})=>{let c=`<circle class="gld pulse" cx="130" cy="120" r="13"/>`+T(130,172,from);
  for(let k=0;k<10;k++){const col=k%2,row=Math.floor(k/2),x=470+col*105,y=26+row*47,me=k===4;
   c+=`<path class="dm" d="M144 120 L${x-14} ${y}"/><path class="flow" style="animation-delay:${k*.26}s" d="M144 120 L${x-14} ${y}" pathLength="200"/>`;
   c+=`<circle class="${me?'st':'nd'}" cx="${x}" cy="${y}" r="11"/>`;
   if(me)c+=T(x-22,y+6,you,'lbl','end');
  }
  return V(c);},
 shift:({left,right,a,b,ia='person',ib='house'})=>V(`<g class="off-g"><rect class="nd off" x="20" y="24" width="320" height="190" rx="14"/></g>${T(180,62,left,'lblm')}${ic(ia,66,104,1.3,'dm')}${T(86,178,a,'lblm')}${ic(ib,244,104,1.3,'dm')}${T(264,178,b,'lblm')}<path class="dm" stroke-dasharray="3 8" d="M122 124h108"/>`+
  `<rect class="nd on" x="380" y="24" width="320" height="190" rx="14"/>${T(540,62,right,'lbl gldt')}${ic(ib,426,104,1.3)}${T(446,178,b)}${ic(ia,604,104,1.3)}${T(624,178,a)}<path class="dm" d="M482 124h108"/><path class="flow" pathLength="200" d="M482 124h108"/>`),
 journey:({steps})=>{const n=steps.length,x0=(720-(n*142+(n-1)*36))/2;return V(steps.map(([ico,l],k)=>{const x=x0+k*178;return `<g class="in d${k+1}"><rect class="nd" x="${x}" y="46" width="142" height="142" rx="14"/>${ic(ico,x+47,72,1.6)}${T(x+71,164,l)}</g>`+(k<n-1?`<path class="dm" d="M${x+146} 117h28"/><path class="flow" pathLength="200" style="animation-delay:${k*.8}s" d="M${x+146} 117h28"/>`:'');}).join(''));},
 curves:({slow,fast,axis,two})=>V(`<path class="dm" d="M70 30v178h590"/>`+T(660,232,axis,'lblm','end')+`<path class="st draw" pathLength="1" d="M70 202C260 196 470 170 640 118" style="stroke:var(--soft)"/>${T(640,104,slow,'lbl','end')}`+(two?`<path class="st draw d1" pathLength="1" d="M70 202C108 200 118 92 156 68S236 44 290 40"/><g class="in d4">${T(304,46,fast,'lbl gldt','start')}</g>`:'')),
 numbers:({items})=>V(items.map((l,k)=>{const x=24+k*232;return `<g class="in d${k+1}"><circle class="nd on" cx="${x+104}" cy="78" r="36"/>${T(x+104,88,String(k+1),'ttl')}${T(x+104,158,l,'ttl')}</g>`;}).join('')),
 road:()=>{let c=`<path class="dm" d="M176 240 346 58M544 240 374 58"/>`;[[150,190,34],[570,190,34],[222,132,24],[498,132,24],[276,88,16],[444,88,16],[316,60,10],[404,60,10]].forEach(([x,y,r],k)=>{c+=`<path class="in d${Math.min(k+1,6)}" style="fill:var(--f18)" d="M${x} ${y-r*3}C${x+r*.34} ${y-r*1.6} ${x+r*.5} ${y-r*.1} ${x+r*.3} ${y+r*.86}L${x+r*.07} ${y+r*.92}V${y+r*1.24}H${x-r*.07}V${y+r*.92}L${x-r*.3} ${y+r*.86}C${x-r*.5} ${y-r*.1} ${x-r*.34} ${y-r*1.6} ${x} ${y-r*3}Z"/>`;});
  c+=`<path class="st" d="M340 58h40M346 58V12a14 14 0 0 1 28 0v46"/><rect class="gld pulse" x="352" y="14" width="16" height="44" rx="1"/>`;
  [0,1.05,2.1,3.15].forEach((d,k)=>{const x=k%2?-46:46;c+=`<circle class="gld walk" cx="360" cy="222" r="9" style="--x0:${x}px;--y0:0px;--x1:0px;--y1:-162px;animation-delay:${d}s"/>`;});return V(c);},

function visual(v){return VIS[v.type]?VIS[v.type](v):'';}
function fmt(seconds){let n=Math.round(seconds);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function render(broadcast=true){
 const s=S[i],sl=$('slide');
 $('app').classList.toggle('screen',screen);document.body.classList.toggle('static',!motion);
 $('chapter').textContent=s.section+' · '+s.role;$('progress').style.width=((i+1)/S.length*100)+'%';
 sl.className='slide'+(s.v?' has-visual':'')+(s.stats.length?' has-stats':'');
 const proofPart=s.section===D.parts[4];
 const eyebrow=s.faq?`<p class="eyebrow">${esc(s.faq)}</p>`:'';
 const stats=s.stats.length?`<div class="stats">${s.stats.map(([v,l])=>`<div class="stat"><span class="v">${esc(v)}</span><span class="l">${esc(l)}</span></div>`).join('')}</div>`:'';
 const who=(s.who||s.context)?`<p class="who">${s.who?`<b>${esc(s.who)}</b>`+(s.context?' · ':''):''}${esc(s.context)}</p>`:'';
 sl.innerHTML=`${eyebrow}<h1 class="headline">${words(s.key)}</h1><p class="spoken">${words(s.text)}</p>${s.v?`<div class="visual">${visual(s.v)}</div>`:''}${stats}${who}${proofPart?`<div class="ctabar">${esc(D.cta.button)}</div>`:''}`;
 sl.style.animation='none';void sl.offsetWidth;sl.style.animation='';
 if(isPresenter&&i<S.length-1)sl.insertAdjacentHTML('beforeend','<p class="nextline">'+esc(U.nextLine)+' '+esc(S[i+1].plain)+'</p>');
 $('count').textContent=(i+1)+' / '+S.length;$('timer').textContent=fmt(s.start)+' · '+fmt(D.seconds)+' '+U.estimated;
 $('prev').disabled=i===0;$('next').disabled=i===S.length-1;
 $('mode').textContent=screen?U.reading:U.screen;$('mode').setAttribute('aria-pressed',screen);
 $('motion').setAttribute('aria-pressed',motion);$('noteButton').setAttribute('aria-pressed',notes);$('notes').hidden=!notes;
 $('noteText').textContent=[U.frameTag+' '+s.section+' · '+s.role,s.faq&&(U.question+' '+s.faq),s.note].filter(Boolean).join('\n\n');
 $('jump').value=s.section;
 history.replaceState(null,'','#'+(i+1));$('stage').scrollTop=0;
 if(broadcast&&channel)channel.postMessage({type:'slide',index:i});
 window.__deckState={index:i,screen,notes,motion,id:D.id};
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
window.goSlide=go;window.deckData=D;
$('prev').setAttribute('aria-label',U.prev);$('next').setAttribute('aria-label',U.next);$('jump').setAttribute('aria-label',U.part);
$('motion').textContent=U.motion;$('noteButton').textContent=U.notes;$('presenter').textContent=U.presenter;
$('full').setAttribute('aria-label',U.full);$('helpButton').setAttribute('aria-label',U.shortcuts);
$('help').textContent=U.help;$('notesTitle').textContent=U.notes;$('readAll').textContent=U.readAll;
for(const sec of [...new Set(S.map(s=>s.section))]){let o=document.createElement('option');o.value=sec;o.textContent=sec;$('jump').appendChild(o);}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
$('jump').onchange=e=>go(S.findIndex(s=>s.section===e.target.value));
$('mode').onclick=()=>{screen=!screen;render(false)};$('motion').onclick=()=>{motion=!motion;render(false)};
$('noteButton').onclick=()=>{notes=!notes;render(false)};
$('presenter').onclick=()=>window.open(location.pathname+'?presenter=1#'+(i+1),'vsl-presenter-'+D.id,'width=1000,height=800');
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('help').hidden=false;$('help').textContent=U.fullHint;}};
$('helpButton').onclick=()=>$('help').hidden=!$('help').hidden;
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(S.length-1)}else if(e.key.toLowerCase()==='l')$('mode').click();else if(e.key.toLowerCase()==='n')$('noteButton').click();else if(e.key.toLowerCase()==='a')$('motion').click();else if(e.key.toLowerCase()==='p')$('presenter').click();else if(e.key.toLowerCase()==='f')$('full').click();});

// The toolbar hides when the mouse stops, so the screen stays clean to film.
let idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);if(!isPresenter&&!notes)idleT=setTimeout(()=>document.body.classList.add('idle'),2400);}
document.addEventListener('mousemove',wake);wake();
render(false);
