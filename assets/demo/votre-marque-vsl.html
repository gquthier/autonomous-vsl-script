/* Brand tokens, filled by build.py from brand.json. Every color on the page derives from these eight values. */
:root{--bg:#0d0c0a;--fg:#efe9dd;--soft:#cfc8bb;--mut:#9a9386;--accent:#e9c48f;--node:#161411;--panel:#201d17;--on-accent:#14120e;color-scheme:dark;
--line:color-mix(in srgb,var(--fg) 14%,transparent);--f12:color-mix(in srgb,var(--fg) 12%,transparent);--f18:color-mix(in srgb,var(--fg) 18%,transparent);--f20:color-mix(in srgb,var(--fg) 20%,transparent);
--a08:color-mix(in srgb,var(--accent) 8%,transparent);--a12:color-mix(in srgb,var(--accent) 12%,transparent);--a15:color-mix(in srgb,var(--accent) 15%,transparent);--a33:color-mix(in srgb,var(--accent) 33%,transparent);--a47:color-mix(in srgb,var(--accent) 47%,transparent);--a53:color-mix(in srgb,var(--accent) 53%,transparent)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 Instrument,'Helvetica Neue',sans-serif;overflow:hidden}
body.idle{cursor:none}
button,select,input{font:inherit}button,a,select{color:inherit}
button,select{background:none;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
button:hover,a:hover{color:var(--accent);border-color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

rive sur votre téléphone. *Vous rappelez sous cinq minutes*.", "key": "Être choisi.", "v": {"type": "phone", "notif": ["Nouvelle", "demande"], "big": "5 min", "caption": "C’est vous qui rappelez"}, "note": "", "stats": [], "who": "", "context": "", "plain": "Troisième pilier : être choisi. La demande arrive sur votre téléphone. Vous rappelez sous cinq minutes.", "section": "2. Ancienne méthode contre nouvelle", "role": "Nouvelle méthode, nommée", "faq": "", "start": 119.99999999999999, "duration": 6.521739130434783}, {"text": "Cela a l’air simple. Voici vos questions.", "key": "Vos questions.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "Cela a l’air simple. Voici vos questions.", "section": "2. Ancienne méthode contre nouvelle", "role": "Nouvelle méthode, nommée", "faq": "", "start": 126.52173913043477, "duration": 3.0434782608695654}, {"text": "« Ils viennent pour l’essai gratuit *et ils disparaissent*. »", "key": "Ils disparaissent.", "v": null, "note": "Verbatim fictif du modèle. Dans une vraie VSL, citez les mots exacts de votre étude de marché.", "stats": [], "who": "", "context": "", "plain": "« Ils viennent pour l’essai gratuit et ils disparaissent. »", "section": "3. FAQ", "role": "Q1 · Ce qu’il pense", "faq": "Encore des curieux ?", "start": 129.56521739130434, "duration": 3.4782608695652177}, {"text": "Ce qui vous coûte du temps, c’est l’absence de tri.", "key": "L’absence de tri.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "Ce qui vous coûte du temps, c’est l’absence de tri.", "section": "3. FAQ", "role": "Q1 · Pourquoi c’est faux", "faq": "Encore des curieux ?", "start": 133.04347826086956, "duration": 4.347826086956522}, {"text": "Avec la méthode Relais, *vous fixez vos critères* : quartier, horaires, budget minimum.", "key": "Vos critères.", "v": {"type": "filter", "label": "Vos critères"}, "note": "", "stats": [], "who": "", "context": "", "plain": "Avec la méthode Relais, vous fixez vos critères : quartier, horaires, budget minimum.", "section": "3. FAQ", "role": "Q1 · Ce qui est vrai", "faq": "Encore des curieux ?", "start": 137.3913043478261, "duration": 5.217391304347826}, {"text": "Vous lisez chaque demande avant d’appeler. Et vous gardez *le droit de dire non*.", "key": "Le droit de dire non.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "Vous lisez chaque demande avant d’appeler. Et vous gardez le droit de dire non.", "section": "3. FAQ", "role": "Q1 · Ce qui est vrai", "faq": "Encore des curieux ?", "start": 142.6086956521739, "duration": 6.086956521739131}, {"text": "Avant de réserver, chacun indique son objectif, son quartier, son budget et ses horaires.", "key": "Objectif. Quartier. Budget.", "v": {"type": "card", "title": "Nouvelle demande", "tag": "Exemple", "rows": [["Objectif", "Reprendre le sport"], ["Quartier", "Dans votre zone"], ["Budget annoncé", "Dans vos critères"], ["Horaires", "Après 18 h"]]}, "note": "", "stats": [], "who": "", "context": "", "plain": "Avant de réserver, chacun indique son objectif, son quartier, son budget et ses horaires.", "section": "3. FAQ", "role": "Q1 · Ce qui est vrai", "faq": "Encore des curieux ?", "start": 148.69565217391303, "duration": 6.086956521739131}, {"text": "Dans notre exemple, *seize demandes sur vingt* sont venues à leur essai.", "key": "16 sur 20.", "v": null, "note": "", "stats": [["16 / 20", "demandes venues à leur essai"]], "who": "", "context": "Exemple fictif · salle de sport", "plain": "Dans notre exemple, seize demandes sur vingt sont venues à leur essai.", "section": "3. FAQ", "role": "Q1 · Preuve", "faq": "Encore des curieux ?", "start": 154.78260869565216, "duration": 5.217391304347826}, {"text": "« Je suis en salle toute la journée. Je n’ai pas le temps. »", "key": "Je n’ai pas le temps.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "« Je suis en salle toute la journée. Je n’ai pas le temps. »", "section": "3. FAQ", "role": "Q2 · Ce qu’il pense", "faq": "Je n’ai pas le temps.", "start": 159.99999999999997, "duration": 5.217391304347826}, {"text": "Vous n’avez pas le temps de faire de la publicité. Justement, vous n’en ferez pas.", "key": "Vous n’en ferez pas.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "Vous n’avez pas le temps de faire de la publicité. Justement, vous n’en ferez pas.", "section": "3. FAQ", "role": "Q2 · Pourquoi c’est faux", "faq": "Je n’ai pas le temps.", "start": 165.21739130434779, "duration": 6.521739130434783}, {"text": "Nous gérons les annonces, la fiche Google et le suivi. Vous : *une heure pour démarrer*.", "key": "Une heure pour démarrer.", "v": {"type": "split", "left": {"title": "Nous", "items": ["Annonces", "Fiche Google", "Formulaire et suivi"]}, "right": {"title": "Vous", "items": ["Une heure, accès, photos", "Relire les annonces", "Rappeler, recevoir"]}}, "note": "", "stats": [], "who": "", "context": "", "plain": "Nous gérons les annonces, la fiche Google et le suivi. Vous : une heure pour démarrer.", "section": "3. FAQ", "role": "Q2 · Ce qui est vrai", "faq": "Je n’ai pas le temps.", "start": 171.73913043478257, "duration": 6.521739130434783}, {"text": "Avec la méthode Relais, tout est en ligne *en soixante-douze heures*.", "key": "Tout est en ligne.", "v": {"type": "install", "big": "72 heures", "steps": ["Vos accès", "Installation", "En ligne"]}, "note": "", "stats": [], "who": "", "context": "", "plain": "Avec la méthode Relais, tout est en ligne en soixante-douze heures.", "section": "3. FAQ", "role": "Q2 · Ce qui est vrai", "faq": "Je n’ai pas le temps.", "start": 178.26086956521735, "duration": 4.782608695652175}, {"text": "Une salle de notre exemple a reçu sa première demande *en neuf jours*.", "key": "9 jours.", "v": null, "note": "", "stats": [["9 jours", "entre le lancement et la première demande"]], "who": "", "context": "Exemple fictif · salle de sport", "plain": "Une salle de notre exemple a reçu sa première demande en neuf jours.", "section": "3. FAQ", "role": "Q2 · Preuve", "faq": "Je n’ai pas le temps.", "start": 183.04347826086953, "duration": 5.6521739130434785}, {"text": "« Concrètement, qu’est-ce que j’obtiens ? »", "key": "Qu’est-ce que j’obtiens ?", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "« Concrètement, qu’est-ce que j’obtiens ? »", "section": "3. FAQ", "role": "Q3 · Ce qu’il pense", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 188.695652173913, "duration": 2.2}, {"text": "Une liste de prestations ne remplit aucune salle. Tout doit être relié.", "key": "Tout doit être relié.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "Une liste de prestations ne remplit aucune salle. Tout doit être relié.", "section": "3. FAQ", "role": "Q3 · Pourquoi c’est faux", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 190.895652173913, "duration": 5.217391304347826}, {"text": "Soixante jours de méthode Relais. Annonces, formulaire de tri, fiche Google.", "key": "60 jours, tout compris.", "v": {"type": "stack", "items": ["Annonces créées et pilotées", "Formulaire de tri", "Fiche Google reprise", "Demandes sur votre téléphone", "Tableau chaque lundi", "Deux séances de préparation"], "two": false}, "note": "", "stats": [], "who": "", "context": "", "plain": "Soixante jours de méthode Relais. Annonces, formulaire de tri, fiche Google.", "section": "3. FAQ", "role": "Q3 · Ce qui est vrai", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 196.1130434782608, "duration": 4.782608695652175}, {"text": "Les demandes sur votre téléphone, un tableau chaque lundi, deux séances de préparation.", "key": "Rien à assembler.", "v": {"type": "stack", "items": ["Annonces créées et pilotées", "Formulaire de tri", "Fiche Google reprise", "Demandes sur votre téléphone", "Tableau chaque lundi", "Deux séances de préparation"], "two": true}, "note": "", "stats": [], "who": "", "context": "", "plain": "Les demandes sur votre téléphone, un tableau chaque lundi, deux séances de préparation.", "section": "3. FAQ", "role": "Q3 · Ce qui est vrai", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 200.895652173913, "duration": 5.6521739130434785}, {"text": "Compte publicitaire, page et fiche : *tout reste à votre nom*.", "key": "Tout reste à votre nom.", "v": {"type": "owned", "items": ["Compte publicitaire", "Page", "Fiche Google"], "caption": "À votre nom"}, "note": "", "stats": [], "who": "", "context": "", "plain": "Compte publicitaire, page et fiche : tout reste à votre nom.", "section": "3. FAQ", "role": "Q3 · Ce qui est vrai", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 206.54782608695646, "duration": 4.347826086956522}, {"text": "Chaque lundi, quatre chiffres. Dépenses, demandes, essais, inscriptions.", "key": "Quatre chiffres.", "v": {"type": "dashboard", "items": ["Dépenses", "Demandes", "Essais", "Inscriptions"]}, "note": "", "stats": [], "who": "", "context": "", "plain": "Chaque lundi, quatre chiffres. Dépenses, demandes, essais, inscriptions.", "section": "3. FAQ", "role": "Q3 · Ce qui est vrai", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 210.895652173913, "duration": 3.4782608695652177}, {"text": "Et pendant l’appel, vous repartez avec *trois documents offerts*.", "key": "Trois documents offerts.", "v": {"type": "cards", "items": [["grid", "10 formats", "publicitaires"], ["coin", "Votre coût", "par inscription"], ["web", "Votre page", "refaite, offerte"]], "on": 0}, "note": "", "stats": [], "who": "", "context": "", "plain": "Et pendant l’appel, vous repartez avec trois documents offerts.", "section": "3. FAQ", "role": "Q3 · Ce qui est vrai", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 214.3739130434782, "duration": 3.91304347826087}, {"text": "D’abord, *dix formats publicitaires* qui tournent déjà dans votre ville.", "key": "10 formats publicitaires.", "v": {"type": "cards", "items": [["grid", "10 formats", "publicitaires"], ["coin", "Votre coût", "par inscription"], ["web", "Votre page", "refaite, offerte"]], "on": 1}, "note": "", "stats": [], "who": "", "context": "", "plain": "D’abord, dix formats publicitaires qui tournent déjà dans votre ville.", "section": "3. FAQ", "role": "Q3 · Ce qui est vrai", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 218.28695652173909, "duration": 4.347826086956522}, {"text": "Notre équipe a déjà transmis *deux cent dix demandes*.", "key": "210 demandes.", "v": null, "note": "", "stats": [["210", "demandes transmises"]], "who": "", "context": "Exemple fictif · salle de sport", "plain": "Notre équipe a déjà transmis deux cent dix demandes.", "section": "3. FAQ", "role": "Q3 · Preuve", "faq": "Qu’est-ce que j’obtiens exactement ?", "start": 222.63478260869562, "duration": 3.91304347826087}, {"text": "« Ça va être trop cher pour moi. »", "key": "Trop cher pour moi ?", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "« Ça va être trop cher pour moi. »", "section": "3. FAQ", "role": "Q4 · Ce qu’il pense", "faq": "Combien ça coûte ?", "start": 226.5478260869565, "duration": 3.0434782608695654}, {"text": "La bonne question, c’est ce que vous coûte un été à moitié vide.", "key": "Un été à moitié vide.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "La bonne question, c’est ce que vous coûte un été à moitié vide.", "section": "3. FAQ", "role": "Q4 · Pourquoi c’est faux", "faq": "Combien ça coûte ?", "start": 229.59130434782605, "duration": 5.6521739130434785}, {"text": "Deux montants. Votre budget publicitaire, *à partir de vingt euros par jour*, réglé à la plateforme.", "key": "Deux montants.", "v": {"type": "twin", "a": ["Budget publicitaire", "À partir de 20 € par jour", "Réglé à la plateforme"], "b": ["Notre forfait", "Annoncé avant tout engagement", "Après vos inscriptions"], "both": false}, "note": "", "stats": [], "who": "", "context": "", "plain": "Deux montants. Votre budget publicitaire, à partir de vingt euros par jour, réglé à la plateforme.", "section": "3. FAQ", "role": "Q4 · Ce qui est vrai", "faq": "Combien ça coûte ?", "start": 235.24347826086952, "duration": 6.9565217391304355}, {"text": "Et notre forfait, annoncé avant tout engagement, payable *après vos premières inscriptions*.", "key": "Après vos inscriptions.", "v": {"type": "twin", "a": ["Budget publicitaire", "À partir de 20 € par jour", "Réglé à la plateforme"], "b": ["Notre forfait", "Annoncé avant tout engagement", "Après vos inscriptions"], "both": true}, "note": "", "stats": [], "who": "", "context": "", "plain": "Et notre forfait, annoncé avant tout engagement, payable après vos premières inscriptions.", "section": "3. FAQ", "role": "Q4 · Ce qui est vrai", "faq": "Combien ça coûte ?", "start": 242.19999999999996, "duration": 5.217391304347826}, {"text": "Dans notre exemple : *cinq euros encaissés pour un euro de publicité*.", "key": "5 € pour 1 €.", "v": null, "note": "", "stats": [["5 €", "encaissés pour 1 € de publicité"]], "who": "", "context": "Exemple fictif · salle de sport", "plain": "Dans notre exemple : cinq euros encaissés pour un euro de publicité.", "section": "3. FAQ", "role": "Q4 · Preuve", "faq": "Combien ça coûte ?", "start": 247.41739130434777, "duration": 4.782608695652175}, {"text": "« Et si je m’engage, et qu’il ne se passe rien ? »", "key": "Et si ça ne marche pas ?", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "« Et si je m’engage, et qu’il ne se passe rien ? »", "section": "3. FAQ", "role": "Q5 · Ce qu’il pense", "faq": "Et si ça ne marche pas ?", "start": 252.19999999999996, "duration": 4.347826086956522}, {"text": "Sur ce marché, le risque est souvent pour vous. Ici, il est pour nous.", "key": "Ici, le risque est pour nous.", "v": null, "note": "", "stats": [], "who": "", "context": "", "plain": "Sur ce marché, le risque est souvent pour vous. Ici, il est pour nous.", "section": "3. FAQ", "role": "Q5 · Pourquoi c’est faux", "faq": "Et si ça ne marc function words(text){

 return typo(text).split(/( +)/).map(tok=>{

 stack:({items,two})=>V(items.map((l,k)=>{if(!two&&k>2)return '';const col=k>2?1:0,row=k%3,x=col?392:36,y=38+row*68;return `<g class="in d${(two&&k>2?k-2:k+1)}">${ic('check',x,y-22,.95)}${T(x+42,y,l,'lbl','start')}</g>`;}).join('')),
 cards:({items,on=0})=>V(items.map(([n,a,b],k)=>{const x=20+k*233,dim=on>0&&on!==k+1,lit=on===k+1||on===0;
  return `<g class="in d${k+1} ${dim?'off-g':''}"><rect class="nd ${lit?'on':'off'}" x="${x}" y="30" width="214" height="180" rx="14"/>${ic(n,x+85,56,1.5,lit?'st':'dm')}${T(x+107,152,a,'ttl')}${T(x+107,182,b)}</g>`;}).join('')),
 cta:({question,button})=>V(`<g class="in">${T(360,34,question||D.cta.question)}<rect class="nd on" x="110" y="54" width="500" height="58" rx="10"/><rect class="gld pulse" x="134" y="70" width="2.5" height="26"/></g><g class="in d3"><rect class="gld" x="180" y="142" width="360" height="66" rx="33"/><text x="360" y="183" text-anchor="middle" style="font:500 21px Instrument,sans-serif;fill:var(--on-accent)">${esc(button||D.cta.button)}</text></g>`),
};
function visual(v){return VIS[v.type]?VIS[v.type](v):'';}
function fmt(seconds){let n=Math.round(seconds);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function render(broadcast=true){
 const s=S[i],sl=$('slide');
 $('app').classList.toggle('screen',screen);document.body.classList.toggle('static',!motion);
 $('chapter').textContent=s.section+' · '+s.role;$('progress').style.width=((i+1)/S.length*100)+'%';
 sl.className='slide'+(s.v?' has-visual':'')+(s.stats.length?' has-stats':'');
 const proofPart=s.section===D.parts[4];
 const eyebrow=s.faq?`<p class="eyebrow">${esc(s.faq)}</p>`:'';
 const stats=s.stats.length?`<div class="stats">${s.stats.map(([v,l])=>`<div class="stat"><span class="v">${esc(v)}</span><span class="l">${esc(l)}</span></div>`).join('')}</div>`:'';
 const who=(s.who||s.context)?`<p class="who">${s.who?`<b>${esc(s.who)}</b>`+(s.context?' · ':''):''}${esc(s.context)}</p>`:'';
 sl.innerHTML=`${eyebrow}<h1 class="headline">${words(s.key)}</h1><p class="spoken">${words(s.text)}</p>${s.v?`<div class="visual">${visual(s.v)}</div>`:''}${stats}${who}${proofPart?`<div class="ctabar">${esc(D.cta.button)}</div>`:''}`;
 sl.style.animation='none';void sl.offsetWidth;sl.style.animation='';
 if(isPresenter&&i<S.length-1)sl.insertAdjacentHTML('beforeend','<p class="nextline">'+esc(U.nextLine)+' '+esc(S[i+1].plain)+'</p>');
 $('count').textContent=(i+1)+' / '+S.length;$('timer').textContent=fmt(s.start)+' · '+fmt(D.seconds)+' '+U.estimated;
 $('prev').disabled=i===0;$('next').disabled=i===S.length-1;
 $('mode').textContent=screen?U.reading:U.screen;$('mode').setAttribute('aria-pressed',screen);
 $('motion').setAttribute('aria-pressed',motion);$('noteButton').setAttribute('aria-pressed',notes);$('notes').hidden=!notes;
 $('noteText').textContent=[U.frameTag+' '+s.section+' · '+s.role,s.faq&&(U.question+' '+s.faq),s.note].filter(Boolean).join('\n\n');
 $('jump').value=s.section;
 history.replaceState(null,'','#'+(i+1));$('stage').scrollTop=0;
 if(broadcast&&channel)channel.postMessage({type:'slide',index:i});
 window.__deckState={index:i,screen,notes,motion,id:D.id};
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
window.goSlide=go;window.deckData=D;
$('prev').setAttribute('aria-label',U.prev);$('next').setAttribute('aria-label',U.next);$('jump').setAttribute('aria-label',U.part);
$('motion').textContent=U.motion;$('noteButton').textContent=U.notes;$('presenter').textContent=U.presenter;
$('full').setAttribute('aria-label',U.full);$('helpButton').setAttribute('aria-label',U.shortcuts);
$('help').textContent=U.help;$('notesTitle').textContent=U.notes;$('readAll').textContent=U.readAll;
for(const sec of [...new Set(S.map(s=>s.section))]){let o=document.createElement('option');o.value=sec;o.textContent=sec;$('jump').appendChild(o);}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
$('jump').onchange=e=>go(S.findIndex(s=>s.section===e.target.value));
$('mode').onclick=()=>{screen=!screen;render(false)};$('motion').onclick=()=>{motion=!motion;render(false)};
$('noteButton').onclick=()=>{notes=!notes;render(false)};
$('presenter').onclick=()=>window.open(location.pathname+'?presenter=1#'+(i+1),'vsl-presenter-'+D.id,'width=1000,height=800');
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('help').hidden=false;$('help').textContent=U.fullHint;}};
$('helpButton').onclick=()=>$('help').hidden=!$('help').hidden;
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(S.length-1)}else if(e.key.toLowerCase()==='l')$('mode').click();else if(e.key.toLowerCase()==='n')$('noteButton').click();else if(e.key.toLowerCase()==='a')$('motion').click();else if(e.key.toLowerCase()==='p')$('presenter').click();else if(e.key.toLowerCase()==='f')$('full').click();});
window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1),10)||1)-1));
// The toolbar hides when the mouse stops, so the screen stays clean to film.
let idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);if(!isPresenter&&!notes)idleT=setTimeout(()=>document.body.classList.add('idle'),2400);}
document.addEventListener('mousemove',wake);wake();
render(false);
</script></body></html>
